name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -q ".[test]"
      - run: python -m pytest -q

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the demo dataset
        run: |
          python -m pip install -q .
          meterproof demo --dir demo -q || true
      - name: Run the action on the demo
        id: mp
        uses: ./
        with:
          config: demo/meterproof.yml
          start: "2026-11-01"
          end: "2026-11-15T09:00:00Z"
          fail-on: none
      - name: The planted mistakes are found
        env:
          PROBLEMS: ${{ steps.mp.outputs.problems }}
          RISK: ${{ steps.mp.outputs.revenue-at-risk }}
        run: |
          test "$PROBLEMS" = "5"
          test "$RISK" = "1079.63"
