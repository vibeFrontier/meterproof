[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "meterproof"
dynamic = ["version"]
description = "Check that Stripe will bill the usage your app recorded, before the invoice finalizes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
keywords = ["stripe", "usage-based billing", "metering", "reconciliation", "billing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Environment :: Console",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://meterproof.vibefrontier.com"
Documentation = "https://meterproof.vibefrontier.com/docs/"

[project.scripts]
meterproof = "meterproof.cli:main"

[tool.hatch.version]
path = "src/meterproof/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/meterproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
